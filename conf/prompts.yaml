lexical_field_from_semas: >
  Eres un lingüista experto en la gramática del inglés actual. 
  Teniendo en cuenta que a partir de semas como "" puedes construir el campo léxico de los asientos; tu tarea consiste en bríndarme la lista de campos léxicos que se pueden crear a partir de la siguiente lista de semas:
  lista de semas: {list_of_semes}. 